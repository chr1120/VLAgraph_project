services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vlagraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in landing/.env}
      POSTGRES_DB: ${POSTGRES_DB:-vlagraph}
    volumes:
      - auth_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vlagraph}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-vlagraph}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in landing/.env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      COOKIE_NAME: ${COOKIE_NAME:-access_token}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      OMNIVERSE_LAUNCHER_URL: ${OMNIVERSE_LAUNCHER_URL:-http://host.docker.internal:9188/launch}
      OMNIVERSE_LAUNCH_TOKEN: ${OMNIVERSE_LAUNCH_TOKEN:-}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  landing:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8001
      VITE_GRAPH_APP_URL: http://localhost:9173
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      - auth
    restart: unless-stopped

volumes:
  auth_data:
